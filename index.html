    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cryptix - Next Gen Crypto Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050507;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Critical CSS for Instant Loader */
        #root {
            width: 100vw;
            height: 100vh; /* Fallback */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #050507;
            position: relative;
        }

        .pre-loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            z-index: 10;
            animation: loaderFadeIn 0.5s ease-out forwards;
        }

        .pre-loader-logo {
            width: 6rem;
            height: 6rem;
            color: #10b981;
            filter: drop-shadow(0 0 25px rgba(16,185,129,0.6));
            animation: loaderPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .pre-loader-title {
            font-family: 'Inter', sans-serif;
            font-size: 3.75rem; /* Matches text-6xl */
            font-weight: 900;
            color: white;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            margin: 0;
            line-height: 1;
        }

        .pre-loader-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(16,185,129,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(0.95); }
        }

        @keyframes loaderFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }
        
        /* Nebula Background Mesh (Kept for app usage) */
        .nebula-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #050507;
            overflow: hidden;
            pointer-events: none;
        }
        .nebula-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s ease-in-out infinite alternate;
        }
        .orb-purple {
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: #1A102C;
            animation-duration: 25s;
        }
        .orb-navy {
            bottom: -20%;
            right: -10%;
            width: 70vw;
            height: 70vh;
            background: #0D1117;
            animation-delay: -5s;
            animation-duration: 30s;
        }
        .orb-center {
            top: 30%;
            left: 20%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, #1A102C 0%, transparent 70%);
            opacity: 0.4;
            animation-delay: -10s;
            animation-duration: 22s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 20px) scale(1.05); }
        }
    </style>
